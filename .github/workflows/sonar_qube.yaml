name: SonarQube scan

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build
    runs-on: [self-hosted, solinas]
    container: python:3.9.16-slim
    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref }}
      cancel-in-progress: true

    steps:
      - name: Update Ubuntu
        run: |
          apt update
      - name: Install Ubuntu dependencies
        run: |
          apt install -y \
            curl \
            jq unzip zip
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_ACTION_REPO_READ }}
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: sonarsource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.coverage.skip=${{ vars.SONAR_QUBE_COVERAGE_SKIP }}
            -Dsonar.verbose=${{ vars.SONAR_QUBE_VERBOSE_LOGGING }}
            -Dsonar.projectKey=${{ vars.SONAR_QUBE_PROJECT_KEY_PREFIX }}-${{ github.event.repository.name }}
        #${{ steps.repo-name.outputs.repository-name }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Get sonarqube url
        run: echo "[SonarQube branch scan details](${{ vars.SONAR_QUBE_PROJECT_URL }}-${{ github.event.repository.name }}&pullRequest=$PR_NUMBER)" >> $GITHUB_STEP_SUMMARY
        env:
          PR_NUMBER: ${{ github.event.number }}
      - uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
