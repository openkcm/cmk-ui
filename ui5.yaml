specVersion: "4.0"
metadata:
  name: kms
type: application
framework:
  name: SAPUI5
  version: "1.131.1"
  libraries:
    - name: sap.m
    - name: sap.tnt
    - name: sap.ui.comp
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.uxap
    - name: themelib_sap_horizon
builder:
  resources:
    excludes:
      - "test/e2e/**"
  customTasks:
    - name: ui5-tooling-stringreplace-task
      afterTask: replaceVersion
      configuration:
        prefix: UI5_ENV
        path: ./env/
        separator: "."
        files:
          - "**/*.js"
          - "**/*.xml"
    - name: ui5-tooling-modules-task
      afterTask: replaceVersion
      configuration:
        prependPathMappings: true
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-modules-middleware
      afterMiddleware: compression
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
    - name: ui5-middleware-livereload
      afterMiddleware: compression
    - name: ui5-tooling-stringreplace-middleware
      afterMiddleware: compression
      configuration:
        debug: true
        prefix: UI5_ENV
        path: ./env/
        separator: "."
        files:
          - "**/*.js"
          - "**/*.xml"
    - name: "@ui5/middleware-code-coverage"
      afterMiddleware: compression
      configuration:
        report:
          reporter: ["html"]
          "report-dir": "./coverage/coverage-reports"
          watermarks: {
            statements: [50, 80],
            functions: [50, 80],
            branches: [50, 80],
            lines: [50, 80]
          }
        instrument:
          produceSourceMap: true
          coverageGlobalScope: "window.top"
          coverageGlobalScopeFunc: false
        cwd: "./"
        excludePatterns:
        - "/webapp/test/**"
        - "/webapp/view/**"
        - "/node_modules/**"
